<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ SITEDESCRIPTION }}" />
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
</head>
<body>
  <!-- ======================= NAV ======================= -->
  <header class="nav" id="top">
    <div class="nav__inner">
      <a href="#top" class="nav__brand">KS<span class="dot">.</span></a>
      <nav class="nav__links" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <a class="nav__cta" href="https://github.com/kspalding88" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <p>&copy; <span id="year"></span> Kyle Spalding &middot; Built with Pelican, hosted on GitHub Pages.</p>
    <a href="#top">Back to top &uarr;</a>
  </footer>

  <script src="{{ SITEURL }}/theme/js/main.js"></script>
</body>
</html>
